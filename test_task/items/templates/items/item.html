{% extends 'items/base.html' %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
    <div>
        <h1>{{ page_title }}</h1>
    </div>
    <section>
        <p>{{ item.name }}</p>
        <p>{{ item.description }}</p>
        <p>{{ item.price }}$</p>
        <a href="{% url 'buy' buy_id=item.pk %}">Buy {{ item.name }}</a>
    </section>
{% endblock %}
